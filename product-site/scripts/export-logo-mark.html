<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        background: transparent;
      }
      img {
        display: block;
        width: 128px;
        height: 128px;
      }
    </style>
  </head>
  <body>
    <img id="logo" alt="" />
    <script>
      const logo = new URLSearchParams(window.location.search).get("logo") || "light";
      document.getElementById("logo").src =
        logo === "dark" ? "../src/assets/logo-mark-dark.svg" : "../src/assets/logo-mark-light.svg";
    </script>
  </body>
</html>
